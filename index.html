<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Relink 电竞</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 左下角版本时间 */
        .version-info {
            position: fixed;
            left: 10px;
            bottom: 10px;
            font-size: 14px;
            color: #666;
            z-index: 999;
        }
        .top-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 30px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-wrap {
            position: relative;
        }
        .logo {
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 2.5px #000;
            letter-spacing: 3px;
            white-space: nowrap;
            cursor: pointer;
        }
        .hover-tip {
            position: absolute;
            top: 110%;
            left: 0;
            font-size: 13px;
            color: #222;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .logo-wrap:hover .hover-tip {
            opacity: 1;
        }
        .user-pop-top {
            position: absolute;
            top: 120%;
            left: 0;
            min-width: 320px;
            background: #fff;
            border:1px solid #ccc;
            padding:15px;
            border-radius:6px;
            box-shadow:0 2px 12px #0002;
            display:none;
            z-index:99;
        }
        .logo-wrap:hover .user-pop-top{
            display:block;
        }
        .time-date {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
        }
        .top-line {
            position: fixed;
            top: 90px;
            left: 0;
            width: 100vw;
            height: 2px;
            background: #000;
            z-index: 9;
        }
        .nav-menu {
            position: fixed;
            top: 92px;
            left: 0;
            display: flex;
            padding: 0 30px;
            gap: 60px;
            height: 50px;
            align-items: center;
            z-index: 8;
            background: #fff;
            width: 100vw;
        }
        .nav-item {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            padding: 5px 0;
        }
        .nav-item::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .nav-item.active::after {
            opacity: 1;
        }
        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            line-height: 2.2;
            display: none;
            max-width: 900px;
        }
        .content.show {
            display: block;
        }
        .tool-item {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }
        .tool-item:hover {
            opacity: 0.9;
        }
        /* 测试弹窗 */
        .test-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .test-box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .test-title {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .test-desc {
            margin: 15px 0;
            font-size: 16px;
        }
        .test-btn {
            padding: 10px 20px;
            margin: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .start-btn {
            background: #00C853;
            color: #fff;
        }
        .exit-btn {
            background: #ff4444;
            color: #fff;
        }
        .input-row {
            margin: 12px 0;
        }
        .input-row input, .input-row select {
            padding: 8px;
            width: 120px;
            font-size: 16px;
            margin: 0 8px;
        }
        .click-target {
            width: 200px;
            height: 200px;
            background: #2196F3;
            color: #fff;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px auto;
        }
        .result-text {
            margin: 10px 0;
            font-size: 16px;
            text-align: left;
            line-height: 1.8;
        }
        .green-ready {
            background-color: #4CAF50 !important;
        }
        .account-modal{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.5);
            display:none;
            z-index:999;
            align-items:center;
            justify-content:center;
        }
        .acc-box{
            background:#fff;
            width:450px;
            padding:25px;
            border-radius:8px;
        }
        .acc-item{
            margin:12px 0;
            line-height:2;
        }
        .hide-text{
            color:#999;
            cursor:pointer;
        }
        .del-acc{
            color:red;
            font-weight:bold;
            cursor:pointer;
            margin-top:12px;
        }
        canvas{
            width:100%;
            height:180px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal {
            width: 400px;
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .tab-group {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab.active {
            color: #ffd000;
            border-bottom: 2px solid #ffd000;
        }
        .form-item {
            margin-bottom: 15px;
        }
        .form-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .form-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
        }
        .tip-text {
            font-size: 12px;
            color: red;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <!-- 左下角版本+时间 -->
    <div class="version-info" id="versionText"></div>

    <div class="top-gradient">
        <div class="logo-wrap">
            <div class="logo" id="textArea">Relink 电竞</div>
            <div class="hover-tip">点击切换中英文</div>
            <div class="user-pop-top" id="topUserTip"></div>
        </div>
        <div class="time-date" id="clock"></div>
    </div>

    <div class="top-line"></div>

    <div class="nav-menu">
        <div class="nav-item active" data-page="home">主页</div>
        <div class="nav-item" data-page="order">点单</div>
        <div class="nav-item" data-page="rule">规定</div>
        <div class="nav-item" data-page="login" id="loginBtn">登录</div>
        <div class="nav-item" data-page="other">其他</div>
    </div>

    <div class="content" id="content"></div>

    <!-- 通用测试弹窗 -->
    <div class="test-modal" id="testModal">
        <div class="test-box" id="testBox">
            <div class="test-title" id="testTitle">测试标题</div>
            <div class="test-desc" id="testDesc">测试说明</div>

            <!-- 随机数字输入区域 -->
            <div class="input-row" id="randInputArea" style="display:none;">
                最小值：<input type="number" id="minNum" value="1">
                最大值：<input type="number" id="maxNum" value="100">
            </div>

            <!-- 点击速度 时长选择 -->
            <div class="input-row" id="clickTimeArea" style="display:none;">
                测试时长：
                <select id="clickTimeSel">
                    <option value="3">3 秒</option>
                    <option value="5">5 秒</option>
                    <option value="10">10 秒</option>
                    <option value="30">30 秒</option>
                    <option value="60">60 秒</option>
                </select>
            </div>

            <!-- 点击按钮 -->
            <button class="click-target" id="clickBtn" style="display:none;">点击我</button>

            <div id="testResult"></div>

            <div style="margin-top: 20px;">
                <button class="test-btn start-btn" id="startTest">开始测试</button>
                <button class="test-btn exit-btn" id="exitTest">退出</button>
            </div>
        </div>
    </div>

    <div class="account-modal" id="accModal">
        <div class="acc-box">
            <h3>账号信息</h3>
            <div class="acc-item">用户名：<span id="accName">--</span></div>
            <div class="acc-item">联系方式：<span class="hide-text" id="accContact">点击查看</span></div>
            <div class="acc-item">账号密码：<span class="hide-text" id="accPwd">点击查看</span></div>
            <div class="acc-item">账户货币：<span id="accCoin">0</span></div>
            <div><canvas id="coinChart"></canvas></div>
            <div class="acc-item">
                <label><input type="checkbox" id="lockAcc">账号锁定(开启禁止其他设备登录)</label>
            </div>
            <div class="btn" id="logoutBtn">退出账号</div>
            <div class="del-acc" id="delAcc">注销账号</div>
            <div style="margin-top:10px;">
                <input placeholder="输入账号密码确认注销" id="delPwdInput" style="width:100%;padding:8px;display:none;">
                <button class="btn" id="confirmDel" style="display:none;margin-top:8px;">确认注销全设备账号</button>
            </div>
            <div class="btn" style="margin-top:10px;" id="closeAccModal">关闭</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="close-btn" id="closeModal">×</span>
            <div class="modal-title">请登录/注册</div>
            <div class="tab-group">
                <div class="tab active" data-panel="login">登录</div>
                <div class="tab" data-panel="register">注册</div>
            </div>
            <div class="form-panel active" id="loginPanel">
                <div class="form-item">
                    <label>用户名</label>
                    <input type="text" id="loginUser" placeholder="请输入用户名">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="loginPwd" placeholder="请输入密码">
                </div>
                <div class="tip-text" id="loginTip">用户名或密码错误</div>
                <button class="btn" id="submitLogin">登录</button>
            </div>
            <div class="form-panel" id="registerPanel">
                <div class="form-item">
                    <label>邮箱/手机号</label>
                    <input type="text" id="regContact" placeholder="请输入邮箱或手机号">
                </div>
                <div class="form-item">
                    <label>用户名</label>
                    <input type="text" id="regUser" placeholder="请输入用户名">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="regPwd" placeholder="请输入密码">
                </div>
                <div class="form-item">
                    <label>确认密码</label>
                    <input type="password" id="regPwd2" placeholder="请再次输入密码">
                </div>
                <div class="tip-text" id="regTip">密码不一致</div>
                <button class="btn" id="submitRegister">注册</button>
            </div>
        </div>
    </div>

    <script>
        const chineseText = "Relink 电竞";
        const englishText = "Relink Esports";
        const textEle = document.getElementById("textArea");
        const content = document.getElementById("content");
        const accModal = document.getElementById("accModal");
        const topUserTip = document.getElementById("topUserTip");
        const modalOverlay = document.getElementById("modalOverlay");
        const closeModalBtn = document.getElementById("closeModal");
        const testModal = document.getElementById("testModal");
        const testBox = document.getElementById("testBox");
        const testTitle = document.getElementById("testTitle");
        const testDesc = document.getElementById("testDesc");
        const testResult = document.getElementById("testResult");
        const startTestBtn = document.getElementById("startTest");
        const exitTestBtn = document.getElementById("exitTest");
        const versionText = document.getElementById("versionText");

        const randInputArea = document.getElementById("randInputArea");
        const clickTimeArea = document.getElementById("clickTimeArea");
        const clickBtn = document.getElementById("clickBtn");
        const minNum = document.getElementById("minNum");
        const maxNum = document.getElementById("maxNum");
        const clickTimeSel = document.getElementById("clickTimeSel");

        let isChinese = true;
        let loginUser = null;
        let coinChart = null;
        let currentTest = "";
        let testStartTime = 0;
        let clickTimer = null;
        let clickArr = [];
        let reactionFlag = false;
        const VERSION = "0.0.1.1";

        // 更新版本+时间（无分隔：版本+年月日时分秒）
        function updateVersionTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const timeStr = `${y}${m}${d}${h}${mi}${s}`;
            versionText.innerText = VERSION + timeStr;
        }
        updateVersionTime();
        setInterval(updateVersionTime, 1000);

        // 中英文切换
        textEle.addEventListener("click", () => {
            isChinese = !isChinese;
            textEle.innerText = isChinese ? chineseText : englishText;
        });

        // 顶部系统时钟
        function updateTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${y}-${m}-${d} ${h}:${mi}:${s}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 用户初始化
        function initUsers() {
            if (!localStorage.getItem("users")) {
                const users = [{
                    role: "admin", username: "admin", password: "131010", contact: "管理员",
                    lock: false, coin: 120, coinRecord: [50, 70, 65, 90, 120]
                }];
                localStorage.setItem("users", JSON.stringify(users));
            }
        }
        initUsers();
        function getUsers() {
            return JSON.parse(localStorage.getItem("users")) || [];
        }
        function saveUsers(arr) {
            localStorage.setItem("users", JSON.stringify(arr));
        }

        // 导航菜单
        const navItems = document.querySelectorAll(".nav-item");
        const loginBtn = document.getElementById("loginBtn");
        navItems.forEach(item => {
            item.addEventListener("click", () => {
                navItems.forEach(el => el.classList.remove("active"));
                item.classList.add("active");
                const page = item.dataset.page;
                content.classList.add("show");

                if (page === "home" || page === "order") {
                    content.innerText = loginUser ? "欢迎使用" : "对不起，请先登录再查看";
                } else if (page === "rule") {
                    if (!loginUser) {
                        content.innerText = "对不起，请先登录再查看";
                    } else {
                        content.innerHTML = `
1.打手双倒算炸单，这把不算，还要打（疾风干员开大自救不算）。<br>
2.打手没有达到保底不能结单，老板举报可以补单<br>
3.老板可以养鼠鼠，但是如果见面不打暗号不鼠来不开大的大部分是老鼠，不能养`;
                    }
                } else if (page === "other") {
                    if (!loginUser) {
                        content.innerText = "对不起，请先登录再查看";
                    } else {
                        content.innerHTML = `
                            <p>请选择功能测试：</p>
                            <div class="tool-item" data-tool="randomNum">随机数字</div>
                            <div class="tool-item" data-tool="reaction">反应力测试</div>
                            <div class="tool-item" data-tool="performance">设备性能测试</div>
                            <div class="tool-item" data-tool="clickSpeed">点击速度测试</div>
                        `;
                        bindToolClick();
                    }
                } else if (page === "login") {
                    if (!loginUser) {
                        modalOverlay.style.display = "flex";
                        content.classList.remove("show");
                    } else {
                        openAccountInfo();
                    }
                }
            });
        });

        function bindToolClick() {
            const tools = document.querySelectorAll(".tool-item");
            tools.forEach(tool => {
                tool.addEventListener("click", () => {
                    currentTest = tool.dataset.tool;
                    openTestModal(currentTest);
                });
            });
        }

        // 打开测试弹窗，重置界面
        function openTestModal(type) {
            currentTest = type;
            testResult.innerHTML = "";
            randInputArea.style.display = "none";
            clickTimeArea.style.display = "none";
            clickBtn.style.display = "none";
            testBox.classList.remove("green-ready");
            reactionFlag = false;
            if(clickTimer) clearInterval(clickTimer);

            switch (type) {
                case "randomNum":
                    testTitle.innerText = "随机数字生成";
                    testDesc.innerText = "自定义最小、最大值，点击开始生成随机数";
                    randInputArea.style.display = "block";
                    break;
                case "reaction":
                    testTitle.innerText = "反应力测试";
                    testDesc.innerText = "等待区域变为绿色时，立刻点击画面，测试反应速度";
                    break;
                case "performance":
                    testTitle.innerText = "设备综合性能测评";
                    testDesc.innerText = "读取硬件信息，动态计算各游戏帧率表现";
                    break;
                case "clickSpeed":
                    testTitle.innerText = "点击速度测试(CPS)";
                    testDesc.innerText = "选择测试时长，连续点击按钮，结束查看CPS数据";
                    clickTimeArea.style.display = "block";
                    clickBtn.style.display = "inline-block";
                    break;
            }
            testModal.style.display = "flex";
        }

        // 退出测试
        exitTestBtn.addEventListener("click", () => {
            testModal.style.display = "none";
            currentTest = "";
            if(clickTimer) clearInterval(clickTimer);
            clickArr = [];
        });

        // 开始测试
        startTestBtn.addEventListener("click", () => {
            testResult.innerHTML = "";
            switch (currentTest) {
                // 1. 随机数字
                case "randomNum":
                    let min = parseInt(minNum.value) || 1;
                    let max = parseInt(maxNum.value) || 100;
                    if(min > max) [min,max] = [max,min];
                    let resNum = Math.floor(Math.random() * (max - min + 1)) + min;
                    testResult.innerHTML = `<p>生成结果：<strong>${resNum}</strong> （范围 ${min} ~ ${max}）</p>`;
                    break;

                // 2. 反应力测试 变绿点击
                case "reaction":
                    testResult.innerHTML = "<p>请耐心等待画面变绿...</p>";
                    let delay = Math.floor(Math.random() * 2500) + 1200;
                    setTimeout(() => {
                        testBox.classList.add("green-ready");
                        testResult.innerHTML = "<p style='color:#fff;font-size:22px'>现在立即点击！</p>";
                        testStartTime = Date.now();
                        reactionFlag = true;
                    }, delay);
                    break;

                // 3. 设备性能 + 动态帧率计算（CPU/GPU/内存联动）
                case "performance":
                    const ua = navigator.userAgent;
                    const plat = navigator.platform;
                    const ram = navigator.deviceMemory || 2;
                    const cpuCore = navigator.hardwareConcurrency || 2;
                    const year = new Date().getFullYear() - Math.floor(Math.random() * 7);

                    // 根据UA、核心数、内存判定GPU档次 & 硬件总分
                    let gpuLevel = 1; // 1入门 2中端 3高端 4旗舰
                    let score = 0;

                    // 内存评分
                    if(ram >= 16) score += 30;
                    else if(ram >= 8) score += 20;
                    else if(ram >= 4) score += 10;
                    else score += 5;

                    // CPU核心评分
                    if(cpuCore >= 12) score += 30;
                    else if(cpuCore >= 8) score += 22;
                    else if(cpuCore >= 4) score += 14;
                    else score += 6;

                    // 系统/设备标识判断显卡
                    if(/Android|Mobile|iPhone|iPad/i.test(ua)){
                        if(cpuCore >= 8 && ram >= 8) gpuLevel = 2;
                        else gpuLevel = 1;
                    } else {
                        if(cpuCore >= 10 && ram >= 16) gpuLevel = 4;
                        else if(cpuCore >= 6 && ram >= 12) gpuLevel = 3;
                        else if(cpuCore >= 4 && ram >= 8) gpuLevel = 2;
                        else gpuLevel = 1;
                    }
                    score += gpuLevel * 12;

                    // 硬件档位
                    let levelText = "";
                    if(score >= 75) levelText = "旗舰级游戏设备";
                    else if(score >= 55) levelText = "高端游戏设备";
                    else if(score >= 35) levelText = "中端主流设备";
                    else levelText = "入门办公/轻度设备";

                    // 游戏基础帧率区间 + 动态随机波动
                    const gameConfig = [
                        {
                            name:"植物大战僵尸",
                            baseMin:60, baseAvg:85, baseMax:110,
                            fluct:12
                        },
                        {
                            name:"我的世界",
                            baseMin:45, baseAvg:70, baseMax:95,
                            fluct:10
                        },
                        {
                            name:"PUBG",
                            baseMin:20, baseAvg:38, baseMax:52,
                            fluct:8
                        },
                        {
                            name:"三角洲行动",
                            baseMin:22, baseAvg:40, baseMax:55,
                            fluct:8
                        },
                        {
                            name:"GTA4",
                            baseMin:30, baseAvg:48, baseMax:68,
                            fluct:9
                        },
                        {
                            name:"极限竞速：地平线6",
                            baseMin:18, baseAvg:34, baseMax:48,
                            fluct:7
                        }
                    ];

                    let html = `<div class="result-text">
<strong>==== 设备基础信息 ====</strong><br>
设备类型：${/Android|Mobile|iPhone|iPad/i.test(ua) ? "移动设备" : "电脑设备"}<br>
生产年份：${year} 年<br>
系统平台：${plat}<br>
CPU 核心数：${cpuCore} 核<br>
内存容量：${ram} GB<br>
显卡档次：${gpuLevel === 1 ? "入门核显/低端独显" : gpuLevel === 2 ? "中端独显" : gpuLevel === 3 ? "高端独显" : "旗舰独显"}<br>
综合硬件评分：${score} 分（${levelText}）<br>
浏览器内核：${ua.substring(0,80)}...<br><br>
<strong>==== 游戏动态帧率测试 ====</strong><br>`;

                    // 按硬件分数倍率计算每款游戏真实帧率
                    const rate = score / 60;
                    gameConfig.forEach(g => {
                        let minF = Math.round(g.baseMin * rate + (Math.random() * g.fluct - g.fluct/2));
                        let avgF = Math.round(g.baseAvg * rate + (Math.random() * g.fluct - g.fluct/2));
                        let maxF = Math.round(g.baseMax * rate + (Math.random() * g.fluct - g.fluct/2));
                        // 防负数兜底
                        minF = Math.max(10, minF);
                        avgF = Math.max(minF + 2, avgF);
                        maxF = Math.max(avgF + 3, maxF);

                        html += `${g.name} | 最低帧：${minF} | 平均帧：${avgF} | 最高帧：${maxF}<br>`;
                    });
                    html += `</div>`;
                    testResult.innerHTML = html;
                    break;

                // 4. 点击速度 CPS
                case "clickSpeed":
                    let totalTime = parseInt(clickTimeSel.value) * 1000;
                    clickArr = [];
                    let clickCount = 0;
                    let startTime = Date.now();
                    testResult.innerHTML = `<p>测试进行中，请快速点击按钮！剩余时间：${clickTimeSel.value} 秒</p>`;
                    clickBtn.disabled = false;

                    // 点击记录
                    clickBtn.onclick = function(){
                        clickCount++;
                        let now = Date.now();
                        let pass = (now - startTime) / 1000;
                        let cps = clickCount / pass;
                        clickArr.push(cps);
                    };

                    // 倒计时
                    clickTimer = setInterval(()=>{
                        let now = Date.now();
                        let left = totalTime - (now - startTime);
                        if(left <= 0){
                            clearInterval(clickTimer);
                            clickBtn.onclick = null;
                            clickBtn.disabled = true;
                            if(clickArr.length === 0){
                                testResult.innerHTML = "<p>测试结束，本次无点击</p>";
                                return;
                            }
                            let sum = clickArr.reduce((a,b)=>a+b,0);
                            let avgCps = (sum / clickArr.length).toFixed(2);
                            let minCps = Math.min(...clickArr).toFixed(2);
                            let maxCps = Math.max(...clickArr).toFixed(2);
                            testResult.innerHTML = `
<p>测试结束！</p>
<p>平均 CPS：${avgCps}</p>
<p>最低 CPS：${minCps}</p>
<p>最高 CPS：${maxCps}</p>
`;
                        }else{
                            let s = (left / 1000).toFixed(1);
                            testResult.innerHTML = `<p>测试进行中，请快速点击按钮！剩余时间：${s} 秒</p>`;
                        }
                    }, 100);
                    break;
            }
        });

        // 反应力点击判定
        testBox.addEventListener("click", function(){
            if(currentTest === "reaction" && reactionFlag){
                let end = Date.now();
                let t = end - testStartTime;
                testResult.innerHTML = `<p style="font-size:20px;color:#333">你的反应时间：<strong>${t} 毫秒</strong></p>`;
                testBox.classList.remove("green-ready");
                reactionFlag = false;
            }
        });

        window.onload = () => {
            content.innerText = "对不起，请先登录再查看";
            content.classList.add("show");
        };

        // 账号面板
        function openAccountInfo() {
            const u = loginUser;
            document.getElementById('accName').innerText = u.username;
            document.getElementById('accContact').innerText = "点击查看";
            document.getElementById('accPwd').innerText = "点击查看";
            document.getElementById('accCoin').innerText = u.coin;
            document.getElementById('lockAcc').checked = u.lock;
            document.getElementById('delPwdInput').style.display = "none";
            document.getElementById('confirmDel').style.display = "none";
            accModal.style.display = "flex";
            const ctx = document.getElementById('coinChart').getContext('2d');
            if (coinChart) coinChart.destroy();
            coinChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ["第1周", "第2周", "第3周", "第4周", "本周"],
                    datasets: [{ label: "货币", data: u.coinRecord, borderColor: "#ffd000", fill: false }]
                }
            });
            topUserTip.innerHTML = `
<div>用户名：${u.username}</div>
<div class="hide-text acc-contact-top">联系方式：点击查看</div>
<div class="hide-text acc-pwd-top">密码：点击查看</div>
<div>货币：${u.coin}</div>`;
            topUserTip.querySelector('.acc-contact-top').onclick = () => topUserTip.querySelector('.acc-contact-top').innerText = "联系方式：" + u.contact;
            topUserTip.querySelector('.acc-pwd-top').onclick = () => topUserTip.querySelector('.acc-pwd-top').innerText = "密码：" + u.password;
        }

        document.getElementById('accContact').onclick = function () { this.innerText = loginUser.contact; }
        document.getElementById('accPwd').onclick = function () { this.innerText = loginUser.password; }

        // 账号锁定
        document.getElementById('lockAcc').onchange = function () {
            const arr = getUsers();
            const idx = arr.findIndex(x => x.username === loginUser.username);
            arr[idx].lock = this.checked;
            saveUsers(arr);
            loginUser.lock = this.checked;
            alert(this.checked ? "账号已锁定，其他设备无法登录" : "账号解锁");
        };

        // 退出账号
        document.getElementById('logoutBtn').onclick = () => {
            loginUser = null;
            loginBtn.innerText = "登录";
            accModal.style.display = "none";
            topUserTip.innerHTML = "";
            document.querySelector('.nav-item.active').click();
        };

        // 注销账号
        document.getElementById('delAcc').onclick = () => {
            document.getElementById('delPwdInput').style.display = "block";
            document.getElementById('confirmDel').style.display = "block";
        }
        document.getElementById('confirmDel').onclick = () => {
            const p = document.getElementById('delPwdInput').value.trim();
            if (p !== loginUser.password) return alert("密码错误");
            let arr = getUsers().filter(x => x.username !== loginUser.username);
            saveUsers(arr);
            loginUser = null;
            loginBtn.innerText = "登录";
            accModal.style.display = "none";
            alert("账号注销成功");
            document.querySelector('.nav-item.active').click();
        };
        document.getElementById('closeAccModal').onclick = () => {
            accModal.style.display = "none";
        };

        // 登录弹窗关闭
        modalOverlay.onclick = (e) => {
            if (e.target === modalOverlay) modalOverlay.style.display = "none";
        };
        closeModalBtn.onclick = function(){
            modalOverlay.style.display = "none";
            document.getElementById("loginTip").style.display = "none";
            document.getElementById("regTip").style.display = "none";
        }

        // 登录/注册标签切换
        const tabs = document.querySelectorAll(".tab");
        const panels = document.querySelectorAll(".form-panel");
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                tabs.forEach(t => t.classList.remove("active"));
                panels.forEach(p => p.classList.remove("active"));
                document.getElementById(`${tab.dataset.panel}Panel`).classList.add("active");
                tab.classList.add("active");
            });
        });

        // 注册
        document.getElementById("submitRegister").onclick = () => {
            const contact = document.getElementById("regContact").value.trim();
            const username = document.getElementById("regUser").value.trim();
            const pwd = document.getElementById("regPwd").value.trim();
            const pwd2 = document.getElementById("regPwd2").value.trim();
            if (!contact || !username || !pwd || pwd !== pwd2) return alert("填写信息有误或两次密码不一致");
            const users = getUsers();
            if (users.some(x => x.username === username)) return alert("用户名已存在");
            users.push({
                role: "user", username, password: pwd, contact,
                lock: false, coin: 50, coinRecord: [20, 35, 50]
            });
            saveUsers(users);
            alert("注册成功");
            modalOverlay.style.display = "none";
        };

        // 登录
        document.getElementById("submitLogin").onclick = () => {
            const userInput = document.getElementById("loginUser").value.trim();
            const pwdInput = document.getElementById("loginPwd").value.trim();
            const list = getUsers();
            const target = list.find(item => item.username === userInput && item.password === pwdInput);

            if (!target) {
                document.getElementById("loginTip").style.display = "block";
                return;
            }
            if (target.lock) return alert("该账号已锁定，禁止登录");

            loginUser = target;
            loginBtn.innerText = userInput;
            modalOverlay.style.display = "none";
            document.querySelector(".nav-item.active").click();
        };
    </script>
</body>
</html>
