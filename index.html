<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Relink 电竞</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 全局锁定星空背景 */
        body.global-lock {
            background: url('https://picsum.photos/id/1002/1920/1080') no-repeat center center fixed;
            background-size: cover;
        }
        .top-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 30px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-wrap {
            position: relative;
        }
        .logo {
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 2.5px #000;
            letter-spacing: 3px;
            white-space: nowrap;
            cursor: pointer;
        }
        .hover-tip {
            position: absolute;
            top: 110%;
            left: 0;
            font-size: 13px;
            color: #222;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .logo-wrap:hover .hover-tip {
            opacity: 1;
        }
        .user-pop-top {
            position: absolute;
            top: 120%;
            left: 0;
            min-width: 320px;
            background: #fff;
            border:1px solid #ccc;
            padding:15px;
            border-radius:6px;
            box-shadow:0 2px 12px #0002;
            display:none;
            z-index:99;
        }
        .logo-wrap:hover .user-pop-top{
            display:block;
        }
        .time-date {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
        }
        .top-line {
            position: fixed;
            top: 90px;
            left: 0;
            width: 100vw;
            height: 2px;
            background: #000;
            z-index: 9;
        }
        .nav-menu {
            position: fixed;
            top: 92px;
            left: 0;
            display: flex;
            padding: 0 30px;
            gap: 60px;
            height: 50px;
            align-items: center;
            z-index: 8;
            background: #fff;
            width: 100vw;
        }
        .nav-item {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            padding: 5px 0;
        }
        .nav-item::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .nav-item.active::after {
            opacity: 1;
        }
        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            line-height: 2.2;
            display: none;
            max-width: 800px;
        }
        .content.show {
            display: block;
        }
        /* 账号弹窗 */
        .account-modal{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.5);
            display:none;
            z-index:999;
            align-items:center;
            justify-content:center;
        }
        .acc-box{
            background:#fff;
            width:450px;
            padding:25px;
            border-radius:8px;
        }
        .acc-item{
            margin:12px 0;
            line-height:2;
        }
        .hide-text{
            color:#999;
            cursor:pointer;
        }
        .del-acc{
            color:red;
            font-weight:bold;
            cursor:pointer;
            margin-top:12px;
        }
        canvas{
            width:100%;
            height:180px;
        }
        /* 管理员后台 */
        .admin-panel{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.7);
            z-index:9999;
            display:none;
            align-items:center;
            justify-content:center;
        }
        .admin-box{
            background:#fff;
            width:500px;
            padding:30px;
            border-radius:10px;
        }
        .admin-item{
            margin:15px 0;
        }
        .admin-btn{
            padding:10px 20px;
            background:#ff4444;
            color:#fff;
            border:none;
            border-radius:6px;
            cursor:pointer;
            margin-top:10px;
        }
        .admin-btn.green{
            background:#00C853;
        }
        .admin-desc{
            font-size:14px;
            color:#666;
            margin-top:5px;
        }
        input.admin-input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ddd;
            border-radius:5px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal {
            width: 400px;
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .tab-group {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab.active {
            color: #ffd000;
            border-bottom: 2px solid #ffd000;
        }
        .form-item {
            margin-bottom: 15px;
        }
        .form-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .form-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ffd000, #ffec60);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
        }
        .tip-text {
            font-size: 12px;
            color: red;
            margin-top: 5px;
            display: none;
        }
        .user-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            font-size: 12px;
        }
        .user-item {
            padding: 5px 0;
            border-bottom: 1px solid #f5f5f5;
        }
    </style>
</head>

<body>
    <div class="top-gradient">
        <div class="logo-wrap">
            <div class="logo" id="textArea">Relink 电竞</div>
            <div class="hover-tip">点击切换中英文</div>
            <div class="user-pop-top" id="topUserTip"></div>
        </div>
        <div class="time-date" id="clock"></div>
    </div>

    <div class="top-line"></div>

    <div class="nav-menu">
        <div class="nav-item active" data-page="home">主页</div>
        <div class="nav-item" data-page="order">点单</div>
        <div class="nav-item" data-page="rule">规定</div>
        <div class="nav-item" data-page="login" id="loginBtn">登录</div>
        <div class="nav-item" data-page="about">关于</div>
    </div>

    <div class="content" id="content"></div>

    <!-- 账号弹窗 -->
    <div class="account-modal" id="accModal">
        <div class="acc-box">
            <h3>账号信息</h3>
            <div class="acc-item">用户名：<span id="accName">--</span></div>
            <div class="acc-item">联系方式：<span class="hide-text" id="accContact">点击查看</span></div>
            <div class="acc-item">账号密码：<span class="hide-text" id="accPwd">点击查看</span></div>
            <div class="acc-item">账户货币：<span id="accCoin">0</span></div>
            <div><canvas id="coinChart"></canvas></div>
            <div class="acc-item">
                <label><input type="checkbox" id="lockAcc">账号锁定(开启禁止其他设备登录)</label>
            </div>
            <div class="btn" id="logoutBtn">退出账号</div>
            <div class="del-acc" id="delAcc">注销账号</div>
            <div style="margin-top:10px;">
                <input placeholder="输入账号密码确认注销" id="delPwdInput" style="width:100%;padding:8px;display:none;">
                <button class="btn" id="confirmDel" style="display:none;margin-top:8px;">确认注销全设备账号</button>
            </div>
            <div class="btn admin-set-btn" id="adminSetBtn" style="margin-top:10px;display:none;background:#ff4444;">网站总控设置</div>
            <div class="btn" style="margin-top:10px;" id="closeAccModal">关闭</div>
        </div>
    </div>

    <!-- 管理员后台 -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-box">
            <h3>🔧 管理员总控后台</h3>
            <div class="admin-item">
                <label><input type="checkbox" id="globalSiteLock"> 全局锁定网站（跨设备）</label>
                <div class="admin-desc">锁定后仅显示登录页，星空背景，仅 admin 可进入系统</div>
            </div>
            <div class="admin-item">
                <label>普通用户登录后显示文字：</label>
                <input class="admin-input" id="userCustomText" placeholder="例如：系统维护中">
            </div>
            <div class="admin-item">
                <button class="admin-btn green" id="saveAdminSet">保存设置</button>
            </div>
            <hr style="margin:20px 0">
            <div class="admin-item">
                <label>⚠️ 一键清空所有普通账户（保留admin）</label>
                <div class="admin-desc">删除所有非管理员账号，跨设备同步生效</div>
                <button class="admin-btn" id="delAllUser">删除所有普通账户</button>
            </div>
            <div class="btn" style="margin-top:20px;" id="closeAdmin">关闭后台</div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="close-btn" id="closeModal">×</span>
            <div class="modal-title">请登录/注册</div>
            <div class="tab-group">
                <div class="tab active" data-panel="login">登录</div>
                <div class="tab" data-panel="register">注册</div>
            </div>
            <div class="form-panel active" id="loginPanel">
                <div class="form-item">
                    <label>用户名</label>
                    <input type="text" id="loginUser" placeholder="请输入用户名">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="loginPwd" placeholder="请输入密码">
                </div>
                <div class="tip-text" id="loginTip">用户名或密码错误</div>
                <button class="btn" id="submitLogin">登录</button>
                <div class="user-list" id="adminUserList" style="display:none;"></div>
            </div>
            <div class="form-panel" id="registerPanel">
                <div class="form-item">
                    <label>邮箱/手机号</label>
                    <input type="text" id="regContact" placeholder="请输入邮箱或手机号">
                </div>
                <div class="form-item">
                    <label>用户名</label>
                    <input type="text" id="regUser" placeholder="请输入用户名">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="regPwd" placeholder="请输入密码">
                </div>
                <div class="form-item">
                    <label>确认密码</label>
                    <input type="password" id="regPwd2" placeholder="请再次输入密码">
                </div>
                <div class="tip-text" id="regTip">密码不一致</div>
                <button class="btn" id="submitRegister">注册</button>
            </div>
        </div>
    </div>

    <script>
        const chineseText = "Relink 电竞";
        const englishText = "Relink Esports";
        const textEle = document.getElementById("textArea");
        const content = document.getElementById("content");
        const accModal = document.getElementById("accModal");
        const topUserTip = document.getElementById("topUserTip");
        const adminPanel = document.getElementById("adminPanel");
        let isChinese = true;
        let loginUser = null;
        let coinChart = null;

        // 全局配置初始化
        function initConfig() {
            if (!localStorage.getItem("siteConfig")) {
                const def = {
                    globalLock: false,
                    userText: "此页面正在维护中"
                };
                localStorage.setItem("siteConfig", JSON.stringify(def));
            }
        }
        initConfig();
        function getConfig() {
            return JSON.parse(localStorage.getItem("siteConfig"));
        }
        function setConfig(cfg) {
            localStorage.setItem("siteConfig", JSON.stringify(cfg));
        }

        // 检查全局锁定
        function checkGlobalLock() {
            const cfg = getConfig();
            if (cfg.globalLock) {
                document.body.classList.add("global-lock");
                document.querySelector(".nav-menu").style.display = "none";
                document.querySelector(".top-gradient").style.display = "none";
                document.querySelector(".top-line").style.display = "none";
                content.style.display = "none";
                modalOverlay.style.display = "flex";
            } else {
                document.body.classList.remove("global-lock");
                document.querySelector(".nav-menu").style.display = "flex";
                document.querySelector(".top-gradient").style.display = "flex";
                document.querySelector(".top-line").style.display = "block";
            }
        }
        checkGlobalLock();

        // 中英文
        textEle.addEventListener("click", () => {
            isChinese = !isChinese;
            textEle.innerText = isChinese ? chineseText : englishText;
        });

        // 时钟
        function updateTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${y}-${m}-${d} ${h}:${mi}:${s}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 用户数据
        function initUsers() {
            if (!localStorage.getItem("users")) {
                const users = [{
                    role: "admin", username: "admin", password: "131010", contact: "管理员",
                    lock: false, coin: 120, coinRecord: [50, 70, 65, 90, 120]
                }];
                localStorage.setItem("users", JSON.stringify(users));
            }
        }
        initUsers();
        function getUsers() {
            return JSON.parse(localStorage.getItem("users")) || [];
        }
        function saveUsers(arr) {
            localStorage.setItem("users", JSON.stringify(arr));
        }

        // 导航
        const navItems = document.querySelectorAll(".nav-item");
        const loginBtn = document.getElementById("loginBtn");
        const modalOverlay = document.getElementById("modalOverlay");

        navItems.forEach(item => {
            item.addEventListener("click", () => {
                navItems.forEach(el => el.classList.remove("active"));
                item.classList.add("active");
                const page = item.dataset.page;
                content.classList.add("show");

                const cfg = getConfig();
                if (page === "home" || page === "order") {
                    content.innerText = loginUser ? cfg.userText : "对不起，请先登录再查看";
                } else if (page === "rule") {
                    if (!loginUser) {
                        content.innerText = "对不起，请先登录再查看";
                    } else {
                        content.innerHTML = `
1.打手双倒算炸单，这把不算，还要打（疾风干员开大自救不算）。<br>
2.打手没有达到保底不能结单，老板举报可以补单<br>
3.老板可以养鼠鼠，但是如果见面不打暗号不鼠来不开大的大部分是老鼠，不能养`;
                    }
                } else if (page === "about") {
                    content.innerHTML = `
管理员：赵诗远 王睿涵 高维俊<br>
Relink 电竞<br>
2026-4创建<br>
联系方式：3923500604@qq.com 1784496760@qq.com chinadreamteam@163.com 微信:13050130614`;
                } else if (page === "login") {
                    if (!loginUser) {
                        modalOverlay.style.display = "flex";
                        content.classList.remove("show");
                    } else {
                        openAccountInfo();
                    }
                }
            });
        });

        window.onload = () => {
            content.innerText = "对不起，请先登录再查看";
            content.classList.add("show");
        };

        // 打开账号面板
        function openAccountInfo() {
            const u = loginUser;
            document.getElementById('accName').innerText = u.username;
            document.getElementById('accContact').innerText = "点击查看";
            document.getElementById('accPwd').innerText = "点击查看";
            document.getElementById('accCoin').innerText = u.coin;
            document.getElementById('lockAcc').checked = u.lock;
            document.getElementById('delPwdInput').style.display = "none";
            document.getElementById('confirmDel').style.display = "none";
            accModal.style.display = "flex";

            // 图表
            const ctx = document.getElementById('coinChart').getContext('2d');
            if (coinChart) coinChart.destroy();
            coinChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ["第1周", "第2周", "第3周", "第4周", "本周"],
                    datasets: [{ label: "货币", data: u.coinRecord, borderColor: "#ffd000", fill: false }]
                }
            });

            // 顶部提示
            topUserTip.innerHTML = `
<div>用户名：${u.username}</div>
<div class="hide-text acc-contact-top">联系方式：点击查看</div>
<div class="hide-text acc-pwd-top">密码：点击查看</div>
<div>货币：${u.coin}</div>`;
            topUserTip.querySelector('.acc-contact-top').onclick = () => {
                topUserTip.querySelector('.acc-contact-top').innerText = "联系方式：" + u.contact;
            };
            topUserTip.querySelector('.acc-pwd-top').onclick = () => {
                topUserTip.querySelector('.acc-pwd-top').innerText = "密码：" + u.password;
            };

            // 管理员显示后台按钮
            document.getElementById('adminSetBtn').style.display = u.role === 'admin' ? 'block' : 'none';
        }

        // 查看信息
        document.getElementById('accContact').onclick = function () { this.innerText = loginUser.contact; }
        document.getElementById('accPwd').onclick = function () { this.innerText = loginUser.password; }

        // 账号锁定
        document.getElementById('lockAcc').onchange = function () {
            const arr = getUsers();
            const idx = arr.findIndex(x => x.username === loginUser.username);
            arr[idx].lock = this.checked;
            saveUsers(arr);
            loginUser.lock = this.checked;
            alert(this.checked ? "已锁定" : "已解锁");
        };

        // 退出
        document.getElementById('logoutBtn').onclick = () => {
            loginUser = null;
            loginBtn.innerText = "登录";
            accModal.style.display = "none";
            topUserTip.innerHTML = "";
            document.querySelector('.nav-item.active').click();
        };

        // 注销
        document.getElementById('delAcc').onclick = () => {
            document.getElementById('delPwdInput').style.display = "block";
            document.getElementById('confirmDel').style.display = "block";
        }
        document.getElementById('confirmDel').onclick = () => {
            const p = document.getElementById('delPwdInput').value;
            if (p !== loginUser.password) return alert("密码错误");
            let arr = getUsers().filter(x => x.username !== loginUser.username);
            saveUsers(arr);
            loginUser = null;
            loginBtn.innerText = "登录";
            accModal.style.display = "none";
            alert("注销成功");
            document.querySelector('.nav-item.active').click();
        };
        document.getElementById('closeAccModal').onclick = () => {
            accModal.style.display = "none";
            adminPanel.style.display = "none";
        };

        // 管理员后台
        document.getElementById('adminSetBtn').onclick = () => {
            const cfg = getConfig();
            document.getElementById('globalSiteLock').checked = cfg.globalLock;
            document.getElementById('userCustomText').value = cfg.userText;
            adminPanel.style.display = "flex";
        };
        document.getElementById('closeAdmin').onclick = () => {
            adminPanel.style.display = "none";
        };
        document.getElementById('saveAdminSet').onclick = () => {
            const cfg = getConfig();
            cfg.globalLock = document.getElementById('globalSiteLock').checked;
            cfg.userText = document.getElementById('userCustomText').value;
            setConfig(cfg);
            alert("保存成功！跨设备已同步");
            checkGlobalLock();
            adminPanel.style.display = "none";
        };

        // 删除所有普通用户
        document.getElementById('delAllUser').onclick = () => {
            if (!confirm("确定删除所有普通账户？不可恢复")) return;
            let users = getUsers();
            users = users.filter(u => u.role === "admin");
            saveUsers(users);
            alert("已清空所有普通账户！");
            adminPanel.style.display = "none";
        };

        // 登录注册
        const tabs = document.querySelectorAll(".tab");
        const panels = document.querySelectorAll(".form-panel");
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                tabs.forEach(t => t.classList.remove("active"));
                panels.forEach(p => p.classList.remove("active"));
                document.getElementById(`${tab.dataset.panel}Panel`).classList.add("active");
                tab.classList.add("active");
            });
        });

        document.getElementById("closeModal").onclick = () => {
            modalOverlay.style.display = "none";
        };

        // 注册
        document.getElementById("submitRegister").onclick = () => {
            const contact = document.getElementById("regContact").value.trim();
            const username = document.getElementById("regUser").value.trim();
            const pwd = document.getElementById("regPwd").value.trim();
            const pwd2 = document.getElementById("regPwd2").value.trim();
            if (!contact || !username || !pwd || pwd !== pwd2) return alert("信息错误");
            const users = getUsers();
            if (users.some(x => x.username === username)) return alert("已存在");
            users.push({
                role: "user", username, password: pwd, contact,
                lock: false, coin: 50, coinRecord: [20, 35, 50]
            });
            saveUsers(users);
            alert("注册成功");
            modalOverlay.style.display = "none";
        };

        // 登录
        document.getElementById("submitLogin").onclick = () => {
            const user = document.getElementById("loginUser").value.trim();
            const pwd = document.getElementById("loginPwd").value.trim();
            const list = getUsers();
            const target = list.find(x => x.username === user && x.password === pwd);

            if (!target) {
                document.getElementById("loginTip").style.display = "block";
                return;
            }
            if (target.lock) return alert("账号已锁定");

            const cfg = getConfig();
            if (cfg.globalLock && target.role !== "admin") {
                alert("网站已锁定，仅管理员可进入");
                return;
            }

            loginUser = target;
            loginBtn.innerText = user;
            modalOverlay.style.display = "none";
            checkGlobalLock();
            document.querySelector(".nav-item.active").click();
        };

        modalOverlay.onclick = (e) => {
            if (e.target === modalOverlay) modalOverlay.style.display = "none";
        };
    </script>
</body>
</html>
